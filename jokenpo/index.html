<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campeonato de Jokenpô</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --text: #1f1d1a;
    --muted: #6b665e;
    --p1: #2f6fdb;
    --p2: #d9433b;
    --draw: #8a7f6c;
    --gold: #c99a06;
    --border: #e2ddd2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16151a;
      --card: #211f26;
      --text: #f1efe9;
      --muted: #a39f97;
      --p1: #6b9cff;
      --p2: #ff7a70;
      --draw: #b8ad98;
      --gold: #f2c94c;
      --border: #34313b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { text-align: center; margin: 0 0 20px; font-size: 2rem; }

  .screen { display: none; }
  .screen.active { display: block; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 16px;
    text-align: center;
  }

  button {
    font: inherit;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    background: var(--text);
    color: var(--bg);
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button:disabled { opacity: 0.4; cursor: default; }
  .ok { min-width: 160px; font-size: 1.1rem; }

  /* Tela de nomes */
  .field { text-align: left; margin-bottom: 16px; }
  .field label { display: block; font-weight: 700; margin-bottom: 6px; }
  .field.f1 label { color: var(--p1); }
  .field.f2 label { color: var(--p2); }
  .field input {
    width: 100%;
    font: inherit;
    font-size: 1.1rem;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .field.f1 input:focus { outline: none; border-color: var(--p1); }
  .field.f2 input:focus { outline: none; border-color: var(--p2); }
  .rules { color: var(--muted); font-size: 0.95rem; margin: 4px 0 20px; line-height: 1.5; }

  /* Telas de escolha */
  .round-tag {
    display: inline-block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
    margin-bottom: 12px;
  }
  .round-tag.gold { color: var(--gold); border-color: var(--gold); }
  .pick-title { margin: 0 0 4px; font-size: 1.5rem; overflow-wrap: anywhere; }
  #screen-p1 .pick-title { color: var(--p1); }
  #screen-p2 .pick-title { color: var(--p2); }
  .pick-hint { color: var(--muted); margin: 0 0 20px; overflow-wrap: anywhere; }
  .options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .options button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 14px 8px;
    font-size: 0.95rem;
    background: transparent;
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 14px;
  }
  .options button .emoji { font-size: 2.6rem; line-height: 1.1; }
  #screen-p1 .options button[aria-pressed="true"] { border-color: var(--p1); background: color-mix(in srgb, var(--p1) 15%, transparent); }
  #screen-p2 .options button[aria-pressed="true"] { border-color: var(--p2); background: color-mix(in srgb, var(--p2) 15%, transparent); }

  /* Tela do jogo */
  .game-head { text-align: center; }
  .arena {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
  }
  .arena.gold { border: 2px solid var(--gold); box-shadow: 0 0 24px color-mix(in srgb, var(--gold) 35%, transparent); }
  .player { min-width: 0; }
  .player h2 { margin: 0 0 8px; font-size: 1rem; overflow-wrap: anywhere; }
  .p1 h2 { color: var(--p1); }
  .p2 h2 { color: var(--p2); }
  .hand {
    font-size: clamp(3.5rem, 16vw, 5.5rem);
    line-height: 1;
    height: 1.2em;
    display: inline-block;
  }
  .p2 .hand { transform: scaleX(-1); }
  .choice { margin-top: 8px; color: var(--muted); min-height: 1.4em; font-weight: 600; }
  .vs { font-weight: 800; color: var(--muted); font-size: 1.2rem; }

  .shake .hand { animation: shake 0.3s ease-in-out 3; }
  .p2.shake .hand { animation-name: shake-mirror; }
  @keyframes shake {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
  }
  @keyframes shake-mirror {
    0%, 100% { transform: scaleX(-1) translateY(0); }
    50% { transform: scaleX(-1) translateY(-18px); }
  }
  .winner .hand { filter: drop-shadow(0 0 12px gold); }

  .result {
    text-align: center;
    font-size: 1.25rem;
    font-weight: 700;
    min-height: 1.6em;
    margin: 20px 0 8px;
    overflow-wrap: anywhere;
  }

  .score {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .score div {
    flex: 1;
    max-width: 150px;
    min-width: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
    text-align: center;
  }
  .score span { display: block; font-size: 1.6rem; font-weight: 800; }
  .score small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .s1 { color: var(--p1); }
  .s2 { color: var(--p2); }
  .sd { color: var(--draw); }

  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

  .history { margin-top: 24px; }
  .history h3 { font-size: 0.95rem; color: var(--muted); margin: 0 0 8px; }
  .history ol {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 260px;
    overflow-y: auto;
  }
  .history li {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }
  .history li span:last-child { text-align: right; overflow-wrap: anywhere; }
  .history li.draw { color: var(--muted); }
  .history li.gold { color: var(--gold); font-weight: 700; }

  /* Tela do campeão */
  .trophy { font-size: 5rem; line-height: 1; margin-bottom: 8px; }
  .champ-label { color: var(--muted); margin: 0; font-weight: 600; }
  .champ-name { font-size: 2rem; margin: 4px 0 8px; color: var(--gold); overflow-wrap: anywhere; }
  .champ-detail { color: var(--muted); margin: 0 0 20px; }
</style>
</head>
<body>
<main>
  <h1>Jokenpô ✊✋✌️</h1>

  <!-- Tela 0: nomes -->
  <section class="screen active" id="screen-setup">
    <div class="card">
      <div class="field f1">
        <label for="name1">Nome do Jogador 1</label>
        <input id="name1" maxlength="20" placeholder="Jogador 1" autocomplete="off">
      </div>
      <div class="field f2">
        <label for="name2">Nome do Jogador 2</label>
        <input id="name2" maxlength="20" placeholder="Jogador 2" autocomplete="off">
      </div>
      <p class="rules">
        Campeonato de <strong>10 rodadas</strong>. Empate repete a rodada.<br>
        Se terminar <strong>5 a 5</strong>, tem <strong>rodada de ouro</strong> 🏆
      </p>
      <button class="ok" id="start">Começar campeonato</button>
    </div>
  </section>

  <!-- Tela 1: Jogador 1 escolhe -->
  <section class="screen" id="screen-p1">
    <div class="card">
      <span class="round-tag" data-round-tag></span>
      <h2 class="pick-title" id="pick-title-1"></h2>
      <p class="pick-hint" id="pick-hint-1"></p>
      <div class="options" data-player="1"></div>
      <button class="ok" id="ok1" disabled>OK</button>
    </div>
  </section>

  <!-- Tela 2: Jogador 2 escolhe -->
  <section class="screen" id="screen-p2">
    <div class="card">
      <span class="round-tag" data-round-tag></span>
      <h2 class="pick-title" id="pick-title-2"></h2>
      <p class="pick-hint" id="pick-hint-2"></p>
      <div class="options" data-player="2"></div>
      <button class="ok" id="ok2" disabled>OK</button>
    </div>
  </section>

  <!-- Tela 3: Jogo -->
  <section class="screen" id="screen-game">
    <div class="game-head"><span class="round-tag" data-round-tag></span></div>
    <div class="card arena" id="arena">
      <div class="player p1" id="p1">
        <h2 data-name="1"></h2>
        <div class="hand" id="h1">✊</div>
        <div class="choice" id="c1">???</div>
      </div>
      <div class="vs">VS</div>
      <div class="player p2" id="p2">
        <h2 data-name="2"></h2>
        <div class="hand" id="h2">✊</div>
        <div class="choice" id="c2">???</div>
      </div>
    </div>

    <div class="result" id="result"></div>

    <div class="score">
      <div><span class="s1" data-score="1">0</span><small data-name="1"></small></div>
      <div><span class="sd" data-score="draw">0</span><small>Empates</small></div>
      <div><span class="s2" data-score="2">0</span><small data-name="2"></small></div>
    </div>

    <div class="controls">
      <button id="play">Jogar</button>
      <button id="next" hidden></button>
      <button id="quit" class="secondary">Abandonar</button>
    </div>

    <section class="history">
      <h3>Histórico</h3>
      <ol data-log></ol>
    </section>
  </section>

  <!-- Tela 4: Campeão -->
  <section class="screen" id="screen-champ">
    <div class="card">
      <div class="trophy">🏆</div>
      <p class="champ-label">Campeão</p>
      <h2 class="champ-name" id="champ-name"></h2>
      <p class="champ-detail" id="champ-detail"></p>
      <div class="score">
        <div><span class="s1" data-score="1">0</span><small data-name="1"></small></div>
        <div><span class="sd" data-score="draw">0</span><small>Empates</small></div>
        <div><span class="s2" data-score="2">0</span><small data-name="2"></small></div>
      </div>
      <div class="controls">
        <button id="rematch">Revanche</button>
        <button id="new-players" class="secondary">Novos jogadores</button>
      </div>
    </div>
    <section class="history">
      <h3>Histórico</h3>
      <ol data-log></ol>
    </section>
  </section>
</main>

<script>
  const TOTAL_ROUNDS = 10;
  const OPTIONS = [
    { name: 'Pedra',   emoji: '✊', beats: 'Tesoura' },
    { name: 'Papel',   emoji: '✋', beats: 'Pedra' },
    { name: 'Tesoura', emoji: '✌️', beats: 'Papel' },
  ];
  const RANDOM = { name: 'Aleatório', emoji: '🎲' };
  const $ = id => document.getElementById(id);
  const $$ = sel => document.querySelectorAll(sel);

  const names = { 1: 'Jogador 1', 2: 'Jogador 2' };
  const selected = { 1: null, 2: null };
  let state;

  function newChampionship() {
    state = { wins: { 1: 0, 2: 0 }, draws: 0, round: 1, golden: false, history: [] };
    $$('[data-log]').forEach(ol => ol.innerHTML = '');
    updateScore();
    startRound();
  }

  function show(id) {
    $$('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    window.scrollTo(0, 0);
  }

  function roundLabel() {
    return state.golden ? '🏆 Rodada de ouro' : `Rodada ${state.round} de ${TOTAL_ROUNDS}`;
  }

  function updateScore() {
    $$('[data-score="1"]').forEach(e => e.textContent = state.wins[1]);
    $$('[data-score="2"]').forEach(e => e.textContent = state.wins[2]);
    $$('[data-score="draw"]').forEach(e => e.textContent = state.draws);
  }

  function applyNames() {
    $$('[data-name="1"]').forEach(e => e.textContent = names[1]);
    $$('[data-name="2"]').forEach(e => e.textContent = names[2]);
    $('pick-title-1').textContent = `Vez de ${names[1]}`;
    $('pick-hint-1').textContent = `Escolha sua jogada sem ${names[2]} ver 👀`;
    $('pick-title-2').textContent = `Vez de ${names[2]}`;
    $('pick-hint-2').textContent = `${names[1]} já escolheu. Agora é você!`;
  }

  function startRound() {
    clearPicker(1);
    clearPicker(2);
    $$('[data-round-tag]').forEach(t => {
      t.textContent = roundLabel();
      t.classList.toggle('gold', state.golden);
    });
    $('arena').classList.toggle('gold', state.golden);
    show('screen-p1');
  }

  // Botões de escolha de cada jogador
  $$('.options').forEach(el => {
    const player = el.dataset.player;
    [...OPTIONS, RANDOM].forEach(opt => {
      const btn = document.createElement('button');
      btn.innerHTML = `<span class="emoji">${opt.emoji}</span><span>${opt.name}</span>`;
      btn.setAttribute('aria-pressed', 'false');
      btn.addEventListener('click', () => {
        selected[player] = opt.name;
        el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
        $('ok' + player).disabled = false;
      });
      el.appendChild(btn);
    });
  });

  function clearPicker(player) {
    selected[player] = null;
    $$(`.options[data-player="${player}"] button`).forEach(b => b.setAttribute('aria-pressed', 'false'));
    $('ok' + player).disabled = true;
  }

  function resolve(name) {
    if (name === RANDOM.name) return OPTIONS[Math.floor(Math.random() * OPTIONS.length)];
    return OPTIONS.find(o => o.name === name);
  }

  function addHistory(label, a, b, text, cls) {
    $$('[data-log]').forEach(ol => {
      const li = document.createElement('li');
      if (cls) li.className = cls;
      const left = document.createElement('span');
      const right = document.createElement('span');
      left.textContent = `${label} ${a.emoji} × ${b.emoji}`;
      right.textContent = text;
      li.append(left, right);
      ol.prepend(li);
    });
  }

  // Tela de nomes
  $('start').addEventListener('click', () => {
    names[1] = $('name1').value.trim() || 'Jogador 1';
    names[2] = $('name2').value.trim() || 'Jogador 2';
    if (names[1] === names[2]) { names[1] += ' (1)'; names[2] += ' (2)'; }
    applyNames();
    newChampionship();
  });
  ['name1', 'name2'].forEach(id => $(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') id === 'name1' ? $('name2').focus() : $('start').click();
  }));

  $('ok1').addEventListener('click', () => show('screen-p2'));
  $('ok2').addEventListener('click', () => {
    ['p1', 'p2'].forEach(p => $(p).classList.remove('winner'));
    $('h1').textContent = $('h2').textContent = '✊';
    $('c1').textContent = $('c2').textContent = '???';
    $('result').textContent = 'Os dois já escolheram. Aperte "Jogar"!';
    $('play').hidden = false;
    $('play').disabled = false;
    $('next').hidden = true;
    show('screen-game');
  });

  let afterResult = null;

  $('play').addEventListener('click', () => {
    $('play').disabled = true;
    $('result').textContent = 'Jo... ken... pô!';
    $('p1').classList.add('shake');
    $('p2').classList.add('shake');

    setTimeout(() => {
      $('p1').classList.remove('shake');
      $('p2').classList.remove('shake');
      const a = resolve(selected[1]), b = resolve(selected[2]);
      $('h1').textContent = a.emoji; $('c1').textContent = a.name;
      $('h2').textContent = b.emoji; $('c2').textContent = b.name;

      const label = state.golden ? '🏆' : `#${state.round}`;
      let winner = 0;
      if (a.name !== b.name) winner = a.beats === b.name ? 1 : 2;

      if (!winner) {
        state.draws++;
        $('result').textContent = 'Empate! A rodada vai ser repetida.';
        addHistory(label, a, b, 'Empate (repete)', 'draw');
        setNext('Repetir rodada', startRound);
      } else {
        state.wins[winner]++;
        $('p' + winner).classList.add('winner');
        const [w, l] = winner === 1 ? [a, b] : [b, a];
        $('result').textContent = `${names[winner]} venceu! ${w.name} ganha de ${l.name}`;
        addHistory(label, a, b, names[winner], state.golden ? 'gold' : '');

        if (state.golden) {
          setNext('Ver campeão 🏆', showChampion);
        } else if (state.round >= TOTAL_ROUNDS) {
          if (state.wins[1] === state.wins[2]) {
            state.golden = true;
            $('result').textContent += ` — Deu ${state.wins[1]} a ${state.wins[2]}! Vai ter rodada de ouro!`;
            setNext('Ir pra rodada de ouro 🏆', startRound);
          } else {
            setNext('Ver campeão 🏆', showChampion);
          }
        } else {
          state.round++;
          setNext('Próxima rodada', startRound);
        }
      }
      updateScore();
      $('play').hidden = true;
    }, 900);
  });

  function setNext(text, fn) {
    $('next').textContent = text;
    $('next').hidden = false;
    afterResult = fn;
  }
  $('next').addEventListener('click', () => afterResult && afterResult());

  function showChampion() {
    const champ = state.wins[1] > state.wins[2] ? 1 : 2;
    $('champ-name').textContent = names[champ];
    $('champ-detail').textContent = state.golden
      ? 'Venceu na rodada de ouro!'
      : `Venceu por ${Math.max(state.wins[1], state.wins[2])} a ${Math.min(state.wins[1], state.wins[2])}`;
    show('screen-champ');
  }

  $('rematch').addEventListener('click', newChampionship);
  $('new-players').addEventListener('click', () => show('screen-setup'));
  $('quit').addEventListener('click', () => {
    if (confirm('Abandonar o campeonato? O placar vai ser perdido.')) show('screen-setup');
  });
</script>
</body>
</html>
