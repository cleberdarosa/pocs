<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jokenpô Automático</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --text: #1f1d1a;
    --muted: #6b665e;
    --p1: #2f6fdb;
    --p2: #d9433b;
    --draw: #8a7f6c;
    --border: #e2ddd2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16151a;
      --card: #211f26;
      --text: #f1efe9;
      --muted: #a39f97;
      --p1: #6b9cff;
      --p2: #ff7a70;
      --draw: #b8ad98;
      --border: #34313b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { text-align: center; margin: 0 0 4px; font-size: 2rem; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; }

  .arena {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 12px;
  }
  .player { text-align: center; }
  .player h2 { margin: 0 0 8px; font-size: 1rem; }
  .p1 h2 { color: var(--p1); }
  .p2 h2 { color: var(--p2); }
  .hand {
    font-size: clamp(3.5rem, 16vw, 5.5rem);
    line-height: 1;
    height: 1.2em;
    display: inline-block;
  }
  .p2 .hand { transform: scaleX(-1); }
  .choice { margin-top: 8px; color: var(--muted); min-height: 1.4em; font-weight: 600; }
  .vs { font-weight: 800; color: var(--muted); font-size: 1.2rem; }

  .picker {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 14px;
  }
  .picker button {
    padding: 6px 10px;
    font-size: 1.3rem;
    background: transparent;
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 10px;
    min-width: 44px;
  }
  .p1 .picker button[aria-pressed="true"] { border-color: var(--p1); background: color-mix(in srgb, var(--p1) 15%, transparent); }
  .p2 .picker button[aria-pressed="true"] { border-color: var(--p2); background: color-mix(in srgb, var(--p2) 15%, transparent); }
  .pick-label { font-size: 0.8rem; color: var(--muted); margin-top: 6px; min-height: 1.2em; }

  .shake .hand { animation: shake 0.3s ease-in-out 3; }
  .p2.shake .hand { animation-name: shake-mirror; }
  @keyframes shake {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
  }
  @keyframes shake-mirror {
    0%, 100% { transform: scaleX(-1) translateY(0); }
    50% { transform: scaleX(-1) translateY(-18px); }
  }
  .winner .hand { filter: drop-shadow(0 0 12px gold); }

  .result {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 700;
    min-height: 1.6em;
    margin: 20px 0 8px;
  }

  .score {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .score div {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 16px;
    text-align: center;
    min-width: 88px;
  }
  .score span { display: block; font-size: 1.6rem; font-weight: 800; }
  .score small { color: var(--muted); }
  #s1 { color: var(--p1); }
  #s2 { color: var(--p2); }
  #sd { color: var(--draw); }

  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  button {
    font: inherit;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    background: var(--text);
    color: var(--bg);
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button:disabled { opacity: 0.5; cursor: default; }

  .history { margin-top: 24px; }
  .history h3 { font-size: 0.95rem; color: var(--muted); margin: 0 0 8px; }
  .history ol {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 220px;
    overflow-y: auto;
  }
  .history li {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<main>
  <h1>Jokenpô ✊✋✌️</h1>
  <p class="sub">Cada jogador escolhe sua jogada, ou deixa no 🎲 pra sortear.</p>

  <section class="arena">
    <div class="player p1" id="p1">
      <h2>Jogador 1</h2>
      <div class="hand" id="h1">✊</div>
      <div class="choice" id="c1"></div>
      <div class="picker" data-player="1"></div>
      <div class="pick-label" id="l1"></div>
    </div>
    <div class="vs">VS</div>
    <div class="player p2" id="p2">
      <h2>Jogador 2</h2>
      <div class="hand" id="h2">✊</div>
      <div class="choice" id="c2"></div>
      <div class="picker" data-player="2"></div>
      <div class="pick-label" id="l2"></div>
    </div>
  </section>

  <div class="result" id="result">Aperte "Jogar" pra começar!</div>

  <div class="score">
    <div><span id="s1">0</span><small>Jogador 1</small></div>
    <div><span id="sd">0</span><small>Empates</small></div>
    <div><span id="s2">0</span><small>Jogador 2</small></div>
  </div>

  <div class="controls">
    <button id="play">Jogar</button>
    <button id="auto" class="secondary">Modo automático: OFF</button>
    <button id="reset" class="secondary">Zerar</button>
  </div>

  <section class="history">
    <h3>Histórico</h3>
    <ol id="log"></ol>
  </section>
</main>

<script>
  const OPTIONS = [
    { name: 'Pedra',   emoji: '✊', beats: 'Tesoura' },
    { name: 'Papel',   emoji: '✋', beats: 'Pedra' },
    { name: 'Tesoura', emoji: '✌️', beats: 'Papel' },
  ];
  const $ = id => document.getElementById(id);
  const score = { p1: 0, p2: 0, draw: 0 };
  let round = 0, busy = false, autoTimer = null;

  // Escolha de cada jogador: nome da opção ou 'random'
  const selected = { 1: 'random', 2: 'random' };

  const pickRandom = () => OPTIONS[Math.floor(Math.random() * OPTIONS.length)];
  const pick = player => selected[player] === 'random'
    ? pickRandom()
    : OPTIONS.find(o => o.name === selected[player]);

  function buildPickers() {
    document.querySelectorAll('.picker').forEach(el => {
      const player = el.dataset.player;
      const items = [...OPTIONS, { name: 'random', emoji: '🎲' }];
      items.forEach(opt => {
        const btn = document.createElement('button');
        btn.textContent = opt.emoji;
        btn.title = opt.name === 'random' ? 'Aleatório' : opt.name;
        btn.setAttribute('aria-label', btn.title);
        btn.setAttribute('aria-pressed', String(selected[player] === opt.name));
        btn.addEventListener('click', () => {
          selected[player] = opt.name;
          el.querySelectorAll('button').forEach(b =>
            b.setAttribute('aria-pressed', String(b === btn)));
          updateLabel(player);
        });
        el.appendChild(btn);
      });
      updateLabel(player);
    });
  }

  function updateLabel(player) {
    $('l' + player).textContent = selected[player] === 'random'
      ? 'Escolha: aleatório 🎲'
      : `Escolha: ${selected[player]}`;
  }

  function play() {
    if (busy) return;
    busy = true;
    $('play').disabled = true;
    ['p1', 'p2'].forEach(p => $(p).classList.remove('winner'));
    $('h1').textContent = $('h2').textContent = '✊';
    $('c1').textContent = $('c2').textContent = '';
    $('result').textContent = 'Jo... ken... pô!';
    $('p1').classList.add('shake');
    $('p2').classList.add('shake');

    setTimeout(() => {
      $('p1').classList.remove('shake');
      $('p2').classList.remove('shake');
      const a = pick(1), b = pick(2);
      $('h1').textContent = a.emoji; $('c1').textContent = a.name;
      $('h2').textContent = b.emoji; $('c2').textContent = b.name;

      let text;
      if (a.name === b.name) {
        score.draw++; text = 'Empate!';
      } else if (a.beats === b.name) {
        score.p1++; text = `Jogador 1 venceu! ${a.name} ganha de ${b.name}`;
        $('p1').classList.add('winner');
      } else {
        score.p2++; text = `Jogador 2 venceu! ${b.name} ganha de ${a.name}`;
        $('p2').classList.add('winner');
      }
      $('result').textContent = text;
      $('s1').textContent = score.p1;
      $('s2').textContent = score.p2;
      $('sd').textContent = score.draw;

      round++;
      const li = document.createElement('li');
      li.innerHTML = `<span>#${round} ${a.emoji} × ${b.emoji}</span><span></span>`;
      li.lastChild.textContent = text.split('!')[0];
      $('log').prepend(li);

      busy = false;
      $('play').disabled = false;
    }, 900);
  }

  function toggleAuto() {
    if (autoTimer) {
      clearInterval(autoTimer); autoTimer = null;
      $('auto').textContent = 'Modo automático: OFF';
    } else {
      play();
      autoTimer = setInterval(play, 2000);
      $('auto').textContent = 'Modo automático: ON';
    }
  }

  function reset() {
    score.p1 = score.p2 = score.draw = 0; round = 0;
    $('s1').textContent = $('s2').textContent = $('sd').textContent = '0';
    $('log').innerHTML = '';
    $('result').textContent = 'Placar zerado. Bora de novo!';
  }

  buildPickers();
  $('play').addEventListener('click', play);
  $('auto').addEventListener('click', toggleAuto);
  $('reset').addEventListener('click', reset);
</script>
</body>
</html>
