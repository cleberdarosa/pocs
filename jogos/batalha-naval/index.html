<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batalha Naval</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --text: #1f1d1a;
    --muted: #6b665e;
    --p1: #2f6fdb;
    --p2: #d9433b;
    --gold: #c99a06;
    --sea: #dcebf7;
    --sea-edge: #b9d4ea;
    --ship: #5b6b7d;
    --hit: #e0452f;
    --sunk: #7a1f14;
    --miss: #7d97ad;
    --ok: #2e9a5b;
    --border: #e2ddd2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16151a;
      --card: #211f26;
      --text: #f1efe9;
      --muted: #a39f97;
      --p1: #6b9cff;
      --p2: #ff7a70;
      --gold: #f2c94c;
      --sea: #17293b;
      --sea-edge: #24405a;
      --ship: #8a9bb0;
      --hit: #ff6a4d;
      --sunk: #ffb4a3;
      --miss: #6f8aa3;
      --ok: #5fd08e;
      --border: #34313b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16151a;
    --card: #211f26;
    --text: #f1efe9;
    --muted: #a39f97;
    --p1: #6b9cff;
    --p2: #ff7a70;
    --gold: #f2c94c;
    --sea: #17293b;
    --sea-edge: #24405a;
    --ship: #8a9bb0;
    --hit: #ff6a4d;
    --sunk: #ffb4a3;
    --miss: #6f8aa3;
    --ok: #5fd08e;
    --border: #34313b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 560px; }
  .back-link { display: inline-block; color: var(--muted); text-decoration: none; font-weight: 600; margin-bottom: 8px; }
  .back-link:hover { color: var(--text); }
  h1 { text-align: center; margin: 0 0 20px; font-size: 2rem; }

  .screen { display: none; }
  .screen.active { display: block; }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 16px;
  }

  button {
    font: inherit;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    background: var(--text);
    color: var(--bg);
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 3px solid var(--p1); outline-offset: 2px; }

  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

  /* Configuração */
  .group-label { font-weight: 700; margin: 0 0 8px; }
  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 18px;
  }
  .seg button {
    border-radius: 12px;
    background: transparent;
    color: var(--text);
    border: 2px solid var(--border);
    padding: 10px;
  }
  .seg button[aria-pressed="true"] { border-color: var(--text); background: color-mix(in srgb, var(--text) 8%, transparent); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 700; margin-bottom: 6px; }
  .field.f1 label { color: var(--p1); }
  .field.f2 label { color: var(--p2); }
  .field input {
    width: 100%;
    font: inherit;
    font-size: 1.1rem;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .field input:disabled { opacity: 0.6; }
  .field.f1 input:focus { outline: none; border-color: var(--p1); }
  .field.f2 input:focus { outline: none; border-color: var(--p2); }
  .rules { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin: 0 0 18px; }

  /* Títulos de seção */
  .sec-title { text-align: center; margin: 0 0 4px; font-size: 1.3rem; overflow-wrap: anywhere; }
  .sec-title.t1 { color: var(--p1); }
  .sec-title.t2 { color: var(--p2); }
  .hint { text-align: center; color: var(--muted); margin: 0 0 14px; }

  /* Tabuleiro */
  .grid {
    display: grid;
    grid-template-columns: 1.3em repeat(10, 1fr);
    gap: 2px;
    width: min(100%, 420px);
    margin: 0 auto;
    user-select: none;
  }
  .grid.small { width: min(100%, 280px); }
  .grid .lbl {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .cell {
    aspect-ratio: 1;
    padding: 0;
    border-radius: 3px;
    background: var(--sea);
    border: 1px solid var(--sea-edge);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(0.6rem, 3vw, 1rem);
    line-height: 1;
    min-width: 0;
  }
  button.cell { cursor: pointer; }
  button.cell:disabled { opacity: 1; cursor: default; }
  .cell.ship { background: var(--ship); border-color: var(--ship); }
  .cell.preview { background: color-mix(in srgb, var(--ok) 55%, var(--sea)); border-color: var(--ok); }
  .cell.bad { background: color-mix(in srgb, var(--hit) 40%, var(--sea)); border-color: var(--hit); }
  .cell.miss::after {
    content: "";
    width: 28%;
    height: 28%;
    border-radius: 50%;
    background: var(--miss);
  }
  .cell.hit { background: color-mix(in srgb, var(--hit) 25%, var(--sea)); border-color: var(--hit); }
  .cell.hit::after { content: "✕"; color: var(--hit); font-weight: 900; }
  .cell.ship.hit { background: color-mix(in srgb, var(--hit) 30%, var(--ship)); }
  .cell.sunk { background: var(--hit); border-color: var(--sunk); }
  .cell.sunk::after { color: #ffffff; }
  .cell.last { outline: 2px solid var(--gold); outline-offset: -2px; }
  .grid.target button.cell:not(:disabled):hover { background: color-mix(in srgb, var(--gold) 35%, var(--sea)); }
  .grid.locked { opacity: 0.75; }

  /* Lista de navios */
  .fleet {
    list-style: none;
    padding: 0;
    margin: 14px auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 440px;
  }
  .fleet li {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
  }
  .fleet li .bar { display: inline-flex; gap: 2px; }
  .fleet li .bar i { width: 7px; height: 10px; border-radius: 2px; background: var(--ship); display: block; }
  .fleet li.sunk { text-decoration: line-through; color: var(--muted); }
  .fleet li.sunk .bar i { background: var(--hit); }
  .fleet.pick li { cursor: pointer; }
  .fleet.pick li.current { border-color: var(--ok); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 35%, transparent); }
  .fleet.pick li.placed { color: var(--muted); }
  .fleet.pick li.placed::before { content: "✓"; color: var(--ok); font-weight: 900; }

  .status {
    text-align: center;
    font-size: 1.05rem;
    font-weight: 700;
    min-height: 1.5em;
    margin: 12px 0 4px;
    overflow-wrap: anywhere;
  }
  .status2 { text-align: center; color: var(--muted); min-height: 1.4em; margin: 0 0 12px; overflow-wrap: anywhere; }
  .own-title { text-align: center; color: var(--muted); font-weight: 700; margin: 22px 0 8px; font-size: 0.95rem; overflow-wrap: anywhere; }

  /* Passe o aparelho / Fim */
  .center { text-align: center; }
  .big { font-size: 4rem; line-height: 1; margin-bottom: 10px; }
  .center h2 { margin: 0 0 6px; font-size: 1.6rem; overflow-wrap: anywhere; }
  .center p { color: var(--muted); margin: 0 0 18px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <a class="back-link" href="../index.html">← Jogos</a>
  <h1>Batalha Naval ⚓</h1>

  <!-- Configuração -->
  <section class="screen active" id="screen-setup">
    <div class="panel">
      <p class="group-label">Modo</p>
      <div class="seg" id="mode">
        <button data-mode="cpu" aria-pressed="true">🤖 Contra o computador</button>
        <button data-mode="2p" aria-pressed="false">👥 2 jogadores</button>
      </div>
      <div class="field f1">
        <label for="name1">Jogador 1</label>
        <input id="name1" maxlength="20" placeholder="Jogador 1" autocomplete="off">
      </div>
      <div class="field f2">
        <label for="name2">Jogador 2</label>
        <input id="name2" maxlength="20" placeholder="Jogador 2" autocomplete="off" value="Computador 🤖" disabled>
      </div>
      <p class="rules">
        Cada um esconde 5 navios num mar 10×10, sem um encostar no outro. Um tiro por vez.
        Quem afundar a frota inteira do outro primeiro vence.
      </p>
      <div class="controls"><button id="start">Começar</button></div>
    </div>
  </section>

  <!-- Posicionar navios -->
  <section class="screen" id="screen-place">
    <h2 class="sec-title" id="place-title"></h2>
    <p class="hint" id="place-hint">Escolha o navio e toque no mar pra colocar. Navios não podem encostar. Toque num navio colocado pra tirar.</p>
    <ul class="fleet pick" id="place-fleet"></ul>
    <div class="grid" id="place-grid"></div>
    <div class="controls" style="margin-top:16px">
      <button id="rotate" class="secondary">↻ Girar: deitado</button>
      <button id="random" class="secondary">🎲 Aleatório</button>
      <button id="clear" class="secondary">Limpar</button>
    </div>
    <div class="controls" style="margin-top:12px">
      <button id="ready" disabled>Pronto</button>
    </div>
  </section>

  <!-- Passe o aparelho -->
  <section class="screen" id="screen-handoff">
    <div class="panel center">
      <div class="big">🙈</div>
      <h2 id="handoff-title"></h2>
      <p id="handoff-text"></p>
      <button id="handoff-ok">Estou pronto</button>
    </div>
  </section>

  <!-- Batalha -->
  <section class="screen" id="screen-battle">
    <h2 class="sec-title" id="battle-title"></h2>
    <p class="hint" id="battle-hint"></p>
    <div class="grid target" id="enemy-grid"></div>
    <ul class="fleet" id="enemy-fleet"></ul>
    <p class="status" id="status" aria-live="polite"></p>
    <p class="status2" id="status2" aria-live="polite"></p>
    <div class="controls">
      <button id="pass" hidden>Passar a vez</button>
    </div>
    <p class="own-title" id="own-title"></p>
    <div class="grid small" id="own-grid"></div>
    <div class="controls" style="margin-top:20px">
      <button id="quit" class="secondary">Abandonar</button>
    </div>
  </section>

  <!-- Fim -->
  <section class="screen" id="screen-end">
    <div class="panel center">
      <div class="big" id="end-icon">🏆</div>
      <h2 id="end-title"></h2>
      <p id="end-detail"></p>
      <div class="controls">
        <button id="again">Jogar de novo</button>
        <button id="end-change" class="secondary">Trocar modo</button>
      </div>
    </div>
    <p class="own-title" id="reveal-title"></p>
    <div class="grid small" id="reveal-grid"></div>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const N = 10;
  const COLS = 'ABCDEFGHIJ';
  const FLEET = [
    { name: 'Porta-aviões', size: 5 },
    { name: 'Encouraçado', size: 4 },
    { name: 'Cruzador', size: 3 },
    { name: 'Submarino', size: 3 },
    { name: 'Destróier', size: 2 },
  ];
  const coord = i => COLS[i % N] + (Math.floor(i / N) + 1);

  let vsCpu = true;
  const P = { 1: null, 2: null };
  let turn = 1, lock = false;

  /* ---------- Configuração ---------- */
  $('mode').querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    $('mode').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    vsCpu = btn.dataset.mode === 'cpu';
    $('name2').disabled = vsCpu;
    $('name2').value = vsCpu ? 'Computador 🤖' : '';
  }));

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    window.scrollTo(0, 0);
  }

  function newPlayer(name, isCpu) {
    return {
      name, isCpu,
      ships: FLEET.map(() => null),
      grid: Array(N * N).fill(-1),       // índice do navio em cada casa
      shotsTaken: Array(N * N).fill(0),  // 0 = nada, 1 = água, 2 = acerto
      fired: 0, landed: 0,
    };
  }

  $('start').addEventListener('click', () => {
    let n1 = $('name1').value.trim() || 'Jogador 1';
    let n2 = vsCpu ? 'Computador' : ($('name2').value.trim() || 'Jogador 2');
    if (n1 === n2) { n1 += ' (1)'; n2 += ' (2)'; }
    P[1] = newPlayer(n1, false);
    P[2] = newPlayer(n2, vsCpu);
    lastShot = { 1: null, 2: null };
    startPlacement(1);
  });
  $('name1').addEventListener('keydown', e => { if (e.key === 'Enter') vsCpu ? $('start').click() : $('name2').focus(); });
  $('name2').addEventListener('keydown', e => { if (e.key === 'Enter') $('start').click(); });

  /* ---------- Tabuleiros ---------- */
  function makeGrid(el, interactive, onClick, onHover) {
    el.innerHTML = '';
    el.appendChild(Object.assign(document.createElement('span'), { className: 'lbl' }));
    for (let c = 0; c < N; c++) {
      el.appendChild(Object.assign(document.createElement('span'), { className: 'lbl', textContent: COLS[c] }));
    }
    const cells = [];
    for (let r = 0; r < N; r++) {
      el.appendChild(Object.assign(document.createElement('span'), { className: 'lbl', textContent: r + 1 }));
      for (let c = 0; c < N; c++) {
        const i = r * N + c;
        const cell = document.createElement(interactive ? 'button' : 'span');
        cell.className = 'cell';
        if (interactive) {
          cell.setAttribute('aria-label', coord(i));
          cell.addEventListener('click', () => onClick(i));
          if (onHover) {
            cell.addEventListener('mouseenter', () => onHover(i));
            cell.addEventListener('focus', () => onHover(i));
          }
        }
        el.appendChild(cell);
        cells.push(cell);
      }
    }
    if (onHover) el.addEventListener('mouseleave', () => onHover(null));
    return cells;
  }

  function shipCells(start, size, horiz) {
    const r = Math.floor(start / N), c = start % N;
    if (horiz ? c + size > N : r + size > N) return null;
    return Array.from({ length: size }, (_, k) => horiz ? start + k : start + k * N);
  }
  // Casas em volta (inclusive diagonais)
  function around(i) {
    const r = Math.floor(i / N), c = i % N, out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const rr = r + dr, cc = c + dc;
      if ((dr || dc) && rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc);
    }
    return out;
  }
  // Cabe se as casas estão livres e nenhum navio encosta, nem na diagonal
  const fits = (p, cells) => !!cells &&
    cells.every(i => p.grid[i] === -1 && around(i).every(j => p.grid[j] === -1));

  function placeShip(p, idx, cells) {
    p.ships[idx] = { ...FLEET[idx], cells, hits: 0 };
    cells.forEach(i => p.grid[i] = idx);
  }
  function removeShip(p, idx) {
    p.ships[idx].cells.forEach(i => p.grid[i] = -1);
    p.ships[idx] = null;
  }
  function clearFleet(p) {
    p.ships = FLEET.map(() => null);
    p.grid.fill(-1);
  }
  function randomFleet(p) {
    // Tenta montar a frota; se empacar, recomeça do zero
    for (;;) {
      clearFleet(p);
      const ok = FLEET.every((ship, idx) => {
        for (let tries = 0; tries < 300; tries++) {
          const cells = shipCells(Math.floor(Math.random() * N * N), ship.size, Math.random() < 0.5);
          if (fits(p, cells)) { placeShip(p, idx, cells); return true; }
        }
        return false;
      });
      if (ok) return;
    }
  }

  function fleetBar(size) {
    return `<span class="bar">${'<i></i>'.repeat(size)}</span>`;
  }

  /* ---------- Posicionar navios ---------- */
  let placing = 1, current = 0, horiz = true, hoverAt = null;
  const placeCells = makeGrid($('place-grid'), true, placeClick, i => { hoverAt = i; renderPlace(); });

  function startPlacement(pn) {
    placing = pn;
    current = 0;
    horiz = true;
    hoverAt = null;
    clearFleet(P[pn]);
    $('place-title').textContent = `${P[pn].name}, posicione seus navios`;
    $('place-title').className = 'sec-title t' + pn;
    updateRotate();
    renderPlace();
    show('screen-place');
  }

  function nextUnplaced(from = 0) {
    const p = P[placing];
    for (let k = 0; k < FLEET.length; k++) {
      const idx = (from + k) % FLEET.length;
      if (!p.ships[idx]) return idx;
    }
    return null;
  }

  function placeClick(i) {
    const p = P[placing];
    if (p.grid[i] !== -1) {
      current = p.grid[i];
      removeShip(p, current);
    } else if (current !== null) {
      const cells = shipCells(i, FLEET[current].size, horiz);
      if (!fits(p, cells)) return;
      placeShip(p, current, cells);
      current = nextUnplaced(current);
    }
    renderPlace();
  }

  function renderPlace() {
    const p = P[placing];
    let preview = [], bad = false;
    if (hoverAt !== null && current !== null && p.grid[hoverAt] === -1) {
      const cells = shipCells(hoverAt, FLEET[current].size, horiz);
      if (cells) { preview = cells; bad = !fits(p, cells); }
      else { preview = [hoverAt]; bad = true; }
    }
    placeCells.forEach((cell, i) => {
      cell.className = 'cell';
      if (p.grid[i] !== -1) cell.classList.add('ship');
      if (preview.includes(i)) cell.classList.add(bad ? 'bad' : 'preview');
    });

    const list = $('place-fleet');
    list.innerHTML = '';
    FLEET.forEach((ship, idx) => {
      const li = document.createElement('li');
      if (p.ships[idx]) li.classList.add('placed');
      if (idx === current) li.classList.add('current');
      li.innerHTML = fleetBar(ship.size);
      li.append(` ${ship.name}`);
      li.addEventListener('click', () => {
        if (p.ships[idx]) removeShip(p, idx);
        current = idx;
        renderPlace();
      });
      list.appendChild(li);
    });
    $('ready').disabled = p.ships.some(s => !s);
  }

  function updateRotate() {
    $('rotate').textContent = horiz ? '↻ Girar: deitado' : '↻ Girar: em pé';
  }
  $('rotate').addEventListener('click', () => { horiz = !horiz; updateRotate(); renderPlace(); });
  $('random').addEventListener('click', () => { randomFleet(P[placing]); current = null; renderPlace(); });
  $('clear').addEventListener('click', () => { clearFleet(P[placing]); current = 0; renderPlace(); });
  document.addEventListener('keydown', e => {
    if ((e.key === 'r' || e.key === 'R') && $('screen-place').classList.contains('active') && e.target.tagName !== 'INPUT') {
      $('rotate').click();
    }
  });

  $('ready').addEventListener('click', () => {
    if (vsCpu) {
      randomFleet(P[2]);
      startBattle(1);
    } else if (placing === 1) {
      handoff(2, 'Agora é a vez de posicionar os navios.', () => startPlacement(2));
    } else {
      handoff(1, 'Os dois mares estão prontos. Que comece a batalha!', () => startBattle(1));
    }
  });

  /* ---------- Passe o aparelho ---------- */
  let afterHandoff = null;
  function handoff(pn, text, fn) {
    $('handoff-title').textContent = `Passe pra ${P[pn].name}`;
    $('handoff-text').textContent = `${text} Não vale espiar 👀`;
    afterHandoff = fn;
    show('screen-handoff');
  }
  $('handoff-ok').addEventListener('click', () => afterHandoff && afterHandoff());

  /* ---------- Batalha ---------- */
  const enemyCells = makeGrid($('enemy-grid'), true, humanShot);
  const ownCells = makeGrid($('own-grid'), false);
  const revealCells = makeGrid($('reveal-grid'), false);
  let lastShot = { 1: null, 2: null };

  function other(pn) { return pn === 1 ? 2 : 1; }

  function startBattle(pn) {
    turn = pn;
    lock = false;
    $('pass').hidden = true;
    resetQuit();
    const me = P[pn], foe = P[other(pn)];
    $('battle-title').textContent = `Mar de ${foe.name}`;
    $('battle-title').className = 'sec-title t' + other(pn);
    $('battle-hint').textContent = vsCpu ? 'Toque numa casa pra atirar.' : `${me.name}, toque numa casa pra atirar.`;
    $('own-title').textContent = vsCpu ? 'Seu mar' : `Mar de ${me.name}`;
    $('status').textContent = '';
    $('status2').textContent = '';
    renderBattle();
    show('screen-battle');
  }

  function paintSea(cells, p, showShips, last) {
    cells.forEach((cell, i) => {
      cell.className = 'cell';
      const shot = p.shotsTaken[i];
      const idx = p.grid[i];
      if (showShips && idx !== -1) cell.classList.add('ship');
      if (shot === 1) cell.classList.add('miss');
      if (shot === 2) {
        cell.classList.add('hit');
        if (p.ships[idx].hits === p.ships[idx].size) cell.classList.add('sunk');
      }
      if (i === last) cell.classList.add('last');
      if (cell.tagName === 'BUTTON') cell.disabled = shot !== 0 || lock;
    });
  }

  function renderFleet(el, p) {
    el.innerHTML = '';
    p.ships.forEach(s => {
      const li = document.createElement('li');
      if (s.hits === s.size) li.classList.add('sunk');
      li.innerHTML = fleetBar(s.size);
      li.append(` ${s.name}`);
      el.appendChild(li);
    });
  }

  function renderBattle() {
    const me = P[turn], foe = P[other(turn)];
    paintSea(enemyCells, foe, false, lastShot[turn]);
    paintSea(ownCells, me, true, lastShot[other(turn)]);
    renderFleet($('enemy-fleet'), foe);
    $('enemy-grid').classList.toggle('locked', lock);
  }

  // Dispara em p na casa i. Retorna 'miss', 'hit' ou o navio afundado.
  function fire(shooter, target, i) {
    shooter.fired++;
    const idx = target.grid[i];
    if (idx === -1) { target.shotsTaken[i] = 1; return 'miss'; }
    target.shotsTaken[i] = 2;
    shooter.landed++;
    const ship = target.ships[idx];
    ship.hits++;
    return ship.hits === ship.size ? ship : 'hit';
  }
  const allSunk = p => p.ships.every(s => s.hits === s.size);

  function describe(res) {
    if (res === 'miss') return 'Água 💧';
    if (res === 'hit') return 'Acertou! 💥';
    return `Afundou o ${res.name}! 🔥`;
  }

  function humanShot(i) {
    const me = P[turn], foe = P[other(turn)];
    if (lock || foe.shotsTaken[i]) return;
    const res = fire(me, foe, i);
    lastShot[turn] = i;
    $('status').textContent = `${vsCpu ? 'Você' : me.name} atirou em ${coord(i)}: ${describe(res)}`;
    $('status2').textContent = '';
    lock = true;
    renderBattle();

    if (allSunk(foe)) return setTimeout(() => finish(turn), 900);

    if (vsCpu) {
      $('status2').textContent = 'O computador está mirando...';
      setTimeout(cpuShot, 850);
    } else {
      $('pass').hidden = false;
      $('pass').focus();
    }
  }

  $('pass').addEventListener('click', () => {
    const next = other(turn);
    handoff(next, 'É a sua vez de atirar.', () => startBattle(next));
  });

  /* ---------- Computador ---------- */
  function neighbors(i) {
    const r = Math.floor(i / N), c = i % N, out = [];
    if (r > 0) out.push(i - N);
    if (r < N - 1) out.push(i + N);
    if (c > 0) out.push(i - 1);
    if (c < N - 1) out.push(i + 1);
    return out;
  }

  function cpuPick() {
    const t = P[1];
    // Em volta de navio afundado não tem outro navio (eles não encostam)
    const ruledOut = new Set();
    t.ships.forEach(s => { if (s.hits === s.size) s.cells.forEach(c => around(c).forEach(j => ruledOut.add(j))); });
    const unshot = i => t.shotsTaken[i] === 0 && !ruledOut.has(i);
    // Acertos em navios que ainda não afundaram
    const open = [];
    t.shotsTaken.forEach((s, i) => {
      if (s === 2) {
        const ship = t.ships[t.grid[i]];
        if (ship.hits < ship.size) open.push(i);
      }
    });

    if (open.length) {
      let candidates = [];
      if (open.length >= 2) {
        const rows = new Set(open.map(i => Math.floor(i / N)));
        const cols = new Set(open.map(i => i % N));
        const min = Math.min(...open), max = Math.max(...open);
        if (rows.size === 1) {
          if (min % N > 0) candidates.push(min - 1);
          if (max % N < N - 1) candidates.push(max + 1);
        } else if (cols.size === 1) {
          if (min >= N) candidates.push(min - N);
          if (max < N * (N - 1)) candidates.push(max + N);
        }
        candidates = candidates.filter(unshot);
      }
      if (!candidates.length) candidates = [...new Set(open.flatMap(neighbors))].filter(unshot);
      if (candidates.length) return candidates[Math.floor(Math.random() * candidates.length)];
    }

    // Procurando: prefere casas em xadrez (todo navio tem pelo menos 2 casas)
    const all = [...Array(N * N).keys()].filter(unshot);
    const parity = all.filter(i => (Math.floor(i / N) + i % N) % 2 === 0);
    const pool = parity.length ? parity : all;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function cpuShot() {
    if (!$('screen-battle').classList.contains('active')) return;
    const i = cpuPick();
    const res = fire(P[2], P[1], i);
    lastShot[2] = i;
    $('status2').textContent = `Computador atirou em ${coord(i)}: ${describe(res)}`;
    lock = false;
    renderBattle();
    if (allSunk(P[1])) setTimeout(() => finish(2), 900);
  }

  /* ---------- Fim ---------- */
  function finish(winner) {
    lock = true;
    const w = P[winner], l = P[other(winner)];
    const acc = Math.round((w.landed / w.fired) * 100);
    if (vsCpu && winner === 2) {
      $('end-icon').textContent = '🌊';
      $('end-title').textContent = 'O computador venceu!';
      $('end-detail').textContent = `Ele afundou sua frota em ${w.fired} tiros. Você afundou ${P[2].ships.filter(s => s.hits === s.size).length} de ${FLEET.length} navios.`;
    } else {
      $('end-icon').textContent = '🏆';
      $('end-title').textContent = vsCpu ? 'Você venceu!' : `${w.name} venceu!`;
      $('end-detail').textContent = `Afundou a frota de ${l.name} em ${w.fired} tiros (${acc}% de acerto).`;
    }
    $('reveal-title').textContent = `Mar de ${l.name}`;
    paintSea(revealCells, l, true, null);
    show('screen-end');
  }

  $('again').addEventListener('click', () => {
    P[1] = newPlayer(P[1].name, false);
    P[2] = newPlayer(P[2].name, vsCpu);
    lastShot = { 1: null, 2: null };
    startPlacement(1);
  });
  $('end-change').addEventListener('click', () => show('screen-setup'));

  // Abandonar com confirmação dentro da página
  let quitArmed = false, quitTimer;
  function resetQuit() {
    quitArmed = false;
    clearTimeout(quitTimer);
    $('quit').textContent = 'Abandonar';
  }
  $('quit').addEventListener('click', () => {
    if (quitArmed) { resetQuit(); show('screen-setup'); return; }
    quitArmed = true;
    $('quit').textContent = 'Toque de novo pra abandonar';
    quitTimer = setTimeout(resetQuit, 3000);
  });
</script>
</body>
</html>
