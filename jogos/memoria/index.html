<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo da Memória</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --text: #1f1d1a;
    --muted: #6b665e;
    --p1: #2f6fdb;
    --p2: #d9433b;
    --draw: #8a7f6c;
    --gold: #c99a06;
    --back: #2f6fdb;
    --back-2: #6b4fd8;
    --border: #e2ddd2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16151a;
      --card: #211f26;
      --text: #f1efe9;
      --muted: #a39f97;
      --p1: #6b9cff;
      --p2: #ff7a70;
      --draw: #b8ad98;
      --gold: #f2c94c;
      --back: #3d5fb8;
      --back-2: #6a52c9;
      --border: #34313b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16151a;
    --card: #211f26;
    --text: #f1efe9;
    --muted: #a39f97;
    --p1: #6b9cff;
    --p2: #ff7a70;
    --draw: #b8ad98;
    --gold: #f2c94c;
    --back: #3d5fb8;
    --back-2: #6a52c9;
    --border: #34313b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 560px; }
  .back-link { display: inline-block; color: var(--muted); text-decoration: none; font-weight: 600; margin-bottom: 8px; }
  .back-link:hover { color: var(--text); }
  h1 { text-align: center; margin: 0 0 20px; font-size: 2rem; }

  .screen { display: none; }
  .screen.active { display: block; }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 16px;
  }

  button {
    font: inherit;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    background: var(--text);
    color: var(--bg);
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button:focus-visible { outline: 3px solid var(--p1); outline-offset: 2px; }

  /* Tela de configuração */
  .group-label { font-weight: 700; margin: 0 0 8px; }
  .seg {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px;
    margin-bottom: 18px;
  }
  .seg button {
    border-radius: 12px;
    background: transparent;
    color: var(--text);
    border: 2px solid var(--border);
    padding: 10px;
  }
  .seg button small { display: block; font-weight: 500; color: var(--muted); font-size: 0.8rem; }
  .seg button[aria-pressed="true"] { border-color: var(--text); background: color-mix(in srgb, var(--text) 8%, transparent); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 700; margin-bottom: 6px; }
  .field.f1 label { color: var(--p1); }
  .field.f2 label { color: var(--p2); }
  .field input {
    width: 100%;
    font: inherit;
    font-size: 1.1rem;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .field.f1 input:focus { outline: none; border-color: var(--p1); }
  .field.f2 input:focus { outline: none; border-color: var(--p2); }
  .start-row { text-align: center; margin-top: 4px; }

  /* Placar */
  .score {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .score div {
    flex: 1;
    max-width: 150px;
    min-width: 0;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
    text-align: center;
    transition: border-color 0.2s;
  }
  .score span { display: block; font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .score small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score .turn-1 { border-color: var(--p1); }
  .score .turn-2 { border-color: var(--p2); }
  .c1 { color: var(--p1); }
  .c2 { color: var(--p2); }
  .cm { color: var(--draw); }

  .status {
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    min-height: 1.6em;
    margin: 0 0 14px;
    overflow-wrap: anywhere;
  }

  /* Tabuleiro */
  .board {
    display: grid;
    gap: 8px;
    margin: 0 auto 20px;
  }
  .mcard {
    aspect-ratio: 3 / 4;
    padding: 0;
    border-radius: 12px;
    background: transparent;
    perspective: 700px;
    min-width: 0;
  }
  .mcard .inner {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    transition: transform 0.35s;
    transform-style: preserve-3d;
  }
  .mcard.flipped .inner, .mcard.matched .inner { transform: rotateY(180deg); }
  .mcard .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .mcard .front {
    background: linear-gradient(135deg, var(--back), var(--back-2));
    color: #ffffff;
    font-size: clamp(1.2rem, 6vw, 1.8rem);
    opacity: 0.95;
  }
  .mcard .front::after { content: "?"; font-weight: 800; opacity: 0.55; }
  .mcard .face-up {
    background: var(--card);
    border: 2px solid var(--border);
    transform: rotateY(180deg);
    font-size: clamp(1.8rem, 9vw, 2.8rem);
  }
  .mcard.matched .face-up { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--card)); }
  .mcard.matched.by-1 .face-up { border-color: var(--p1); background: color-mix(in srgb, var(--p1) 12%, var(--card)); }
  .mcard.matched.by-2 .face-up { border-color: var(--p2); background: color-mix(in srgb, var(--p2) 12%, var(--card)); }
  .mcard.wrong .face-up { animation: wobble 0.35s; }
  @keyframes wobble {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-5px); }
    75% { transform: rotateY(180deg) translateX(5px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mcard .inner { transition: none; }
    .mcard.wrong .face-up { animation: none; }
  }

  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

  /* Fim de jogo */
  .end { text-align: center; }
  .end .big { font-size: 4rem; line-height: 1; margin-bottom: 8px; }
  .end h2 { margin: 0 0 6px; font-size: 1.7rem; overflow-wrap: anywhere; }
  .end p { color: var(--muted); margin: 0 0 18px; }
  .record { color: var(--gold) !important; font-weight: 700; }
</style>
</head>
<body>
<main>
  <a class="back-link" href="../index.html">← Jogos</a>
  <h1>Jogo da Memória 🧠</h1>

  <!-- Configuração -->
  <section class="screen active" id="screen-setup">
    <div class="panel">
      <p class="group-label">Modo</p>
      <div class="seg" id="mode">
        <button data-mode="1" aria-pressed="true">👤 Sozinho<small>bata seu recorde</small></button>
        <button data-mode="2" aria-pressed="false">👥 Em dupla<small>no mesmo aparelho</small></button>
      </div>

      <p class="group-label">Nível</p>
      <div class="seg" id="level">
        <button data-level="easy" aria-pressed="true">Fácil<small>6 pares</small></button>
        <button data-level="medium" aria-pressed="false">Médio<small>8 pares</small></button>
        <button data-level="hard" aria-pressed="false">Difícil<small>10 pares</small></button>
      </div>

      <div class="field f1">
        <label for="name1" id="label1">Seu nome</label>
        <input id="name1" maxlength="20" placeholder="Jogador 1" autocomplete="off">
      </div>
      <div class="field f2" id="field2" hidden>
        <label for="name2">Jogador 2</label>
        <input id="name2" maxlength="20" placeholder="Jogador 2" autocomplete="off">
      </div>
      <div class="start-row"><button id="start">Começar</button></div>
    </div>
  </section>

  <!-- Jogo -->
  <section class="screen" id="screen-game">
    <div class="score" id="score-solo">
      <div><span class="cm" id="moves">0</span><small>Jogadas</small></div>
      <div><span class="cm" id="pairs-solo">0/0</span><small>Pares</small></div>
      <div><span class="cm" id="time">0:00</span><small>Tempo</small></div>
    </div>
    <div class="score" id="score-duo" hidden>
      <div id="box1"><span class="c1" id="s1">0</span><small id="n1"></small></div>
      <div><span class="cm" id="pairs-duo">0/0</span><small>Pares</small></div>
      <div id="box2"><span class="c2" id="s2">0</span><small id="n2"></small></div>
    </div>

    <p class="status" id="status" aria-live="polite"></p>

    <div class="board" id="board"></div>

    <div class="controls">
      <button id="restart" class="secondary">Recomeçar</button>
      <button id="change" class="secondary">Trocar modo</button>
    </div>
  </section>

  <!-- Fim -->
  <section class="screen" id="screen-end">
    <div class="panel end">
      <div class="big" id="end-icon">🏆</div>
      <h2 id="end-title"></h2>
      <p id="end-detail"></p>
      <div class="controls">
        <button id="again">Jogar de novo</button>
        <button id="end-change" class="secondary">Trocar modo</button>
      </div>
    </div>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const EMOJIS = ['🐶','🐱','🦊','🐼','🐸','🦁','🐵','🐙','🦄','🐢','🐝','🦋'];
  const LEVELS = {
    easy:   { pairs: 6,  cols: 4 },
    medium: { pairs: 8,  cols: 4 },
    hard:   { pairs: 10, cols: 5 },
  };
  const LEVEL_NAME = { easy: 'Fácil', medium: 'Médio', hard: 'Difícil' };

  let mode = 1, level = 'easy';
  const names = { 1: 'Jogador 1', 2: 'Jogador 2' };
  let deck, open, lock, found, moves, turn, points, timer, seconds, started;

  // Botões de escolha (modo e nível)
  function segmented(groupId, attr, onPick) {
    $(groupId).querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
      $(groupId).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      onPick(btn.dataset[attr]);
    }));
  }
  segmented('mode', 'mode', v => {
    mode = Number(v);
    $('field2').hidden = mode === 1;
    $('label1').textContent = mode === 1 ? 'Seu nome' : 'Jogador 1';
  });
  segmented('level', 'level', v => { level = v; });

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    window.scrollTo(0, 0);
  }

  $('start').addEventListener('click', () => {
    names[1] = $('name1').value.trim() || (mode === 1 ? 'Você' : 'Jogador 1');
    names[2] = $('name2').value.trim() || 'Jogador 2';
    if (mode === 2 && names[1] === names[2]) { names[1] += ' (1)'; names[2] += ' (2)'; }
    $('n1').textContent = names[1];
    $('n2').textContent = names[2];
    newGame();
    show('screen-game');
  });
  ['name1', 'name2'].forEach(id => $(id).addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (id === 'name1' && mode === 2) $('name2').focus(); else $('start').click();
  }));

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function newGame() {
    clearInterval(timer);
    const { pairs, cols } = LEVELS[level];
    const chosen = shuffle(EMOJIS.slice()).slice(0, pairs);
    deck = shuffle([...chosen, ...chosen]);
    open = []; lock = false; found = 0; moves = 0; seconds = 0; started = false;
    turn = 1; points = { 1: 0, 2: 0 };

    const board = $('board');
    board.innerHTML = '';
    board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    board.style.maxWidth = cols === 5 ? '520px' : '420px';
    deck.forEach((emoji, i) => {
      const card = document.createElement('button');
      card.className = 'mcard';
      card.dataset.i = i;
      card.setAttribute('aria-label', 'Carta virada para baixo');
      card.innerHTML = '<span class="inner"><span class="face front"></span><span class="face face-up"></span></span>';
      card.querySelector('.face-up').textContent = emoji;
      card.addEventListener('click', () => flip(card));
      board.appendChild(card);
    });

    $('score-solo').hidden = mode !== 1;
    $('score-duo').hidden = mode !== 2;
    updateHud();
    setStatus(mode === 1 ? 'Ache todos os pares!' : `Vez de ${names[1]}`);
  }

  function setStatus(text) { $('status').textContent = text; }

  function fmtTime(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

  function updateHud() {
    const total = LEVELS[level].pairs;
    $('moves').textContent = moves;
    $('time').textContent = fmtTime(seconds);
    $('pairs-solo').textContent = $('pairs-duo').textContent = `${found}/${total}`;
    $('s1').textContent = points[1];
    $('s2').textContent = points[2];
    $('box1').className = turn === 1 ? 'turn-1' : '';
    $('box2').className = turn === 2 ? 'turn-2' : '';
  }

  function flip(card) {
    if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
    if (!started && mode === 1) {
      started = true;
      timer = setInterval(() => { seconds++; $('time').textContent = fmtTime(seconds); }, 1000);
    }
    card.classList.add('flipped');
    card.setAttribute('aria-label', `Carta ${deck[card.dataset.i]}`);
    open.push(card);
    if (open.length < 2) return;

    moves++;
    const [a, b] = open;
    open = [];
    if (deck[a.dataset.i] === deck[b.dataset.i]) {
      // Achou um par
      found++;
      [a, b].forEach(c => {
        c.classList.remove('flipped');
        c.classList.add('matched');
        if (mode === 2) c.classList.add('by-' + turn);
        c.disabled = true;
      });
      if (mode === 2) {
        points[turn]++;
        setStatus(`${names[turn]} achou um par! Joga de novo.`);
      } else {
        setStatus('Achou um par! 🎉');
      }
      updateHud();
      if (found === LEVELS[level].pairs) setTimeout(finish, 600);
    } else {
      // Errou: mostra por um tempo e desvira
      lock = true;
      [a, b].forEach(c => c.classList.add('wrong'));
      setStatus(mode === 2 ? 'Não é par...' : 'Não é par, tenta de novo.');
      updateHud();
      setTimeout(() => {
        [a, b].forEach(c => {
          c.classList.remove('flipped', 'wrong');
          c.setAttribute('aria-label', 'Carta virada para baixo');
        });
        if (mode === 2) {
          turn = turn === 1 ? 2 : 1;
          setStatus(`Vez de ${names[turn]}`);
          updateHud();
        }
        lock = false;
      }, 900);
    }
  }

  // Recorde do modo sozinho (fica só neste navegador)
  function readBest() {
    try { return JSON.parse(localStorage.getItem('memoria-best-' + level)) || null; } catch { return null; }
  }
  function saveBest(best) {
    try { localStorage.setItem('memoria-best-' + level, JSON.stringify(best)); } catch {}
  }

  function finish() {
    clearInterval(timer);
    const detail = $('end-detail');
    detail.classList.remove('record');
    if (mode === 1) {
      $('end-icon').textContent = '🎉';
      $('end-title').textContent = `Parabéns, ${names[1]}!`;
      let text = `${LEVEL_NAME[level]}: ${moves} jogadas em ${fmtTime(seconds)}.`;
      const best = readBest();
      if (!best || moves < best.moves || (moves === best.moves && seconds < best.seconds)) {
        saveBest({ moves, seconds });
        if (best) { text += ' Novo recorde!'; detail.classList.add('record'); }
      } else {
        text += ` Recorde: ${best.moves} jogadas em ${fmtTime(best.seconds)}.`;
      }
      detail.textContent = text;
    } else {
      const [p1, p2] = [points[1], points[2]];
      if (p1 === p2) {
        $('end-icon').textContent = '🤝';
        $('end-title').textContent = 'Empate!';
      } else {
        $('end-icon').textContent = '🏆';
        $('end-title').textContent = `${names[p1 > p2 ? 1 : 2]} venceu!`;
      }
      detail.textContent = `${names[1]} ${p1} × ${p2} ${names[2]}`;
    }
    show('screen-end');
  }

  $('restart').addEventListener('click', newGame);
  $('again').addEventListener('click', () => { newGame(); show('screen-game'); });
  [$('change'), $('end-change')].forEach(b => b.addEventListener('click', () => {
    clearInterval(timer);
    show('screen-setup');
  }));
</script>
</body>
</html>
