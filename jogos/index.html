<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogos</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --text: #1f1d1a;
    --muted: #6b665e;
    --accent: #2f6fdb;
    --border: #e2ddd2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16151a;
      --card: #211f26;
      --text: #f1efe9;
      --muted: #a39f97;
      --accent: #6b9cff;
      --border: #34313b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16151a;
    --card: #211f26;
    --text: #f1efe9;
    --muted: #a39f97;
    --accent: #6b9cff;
    --border: #34313b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  main { width: 100%; max-width: 760px; }
  h1 { text-align: center; margin: 0 0 4px; font-size: 2.2rem; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 28px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }
  .game {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: inherit;
    text-decoration: none;
    transition: transform 0.15s, border-color 0.15s;
  }
  a.game:hover, a.game:focus-visible { transform: translateY(-3px); border-color: var(--accent); outline: none; }
  .game .icon { font-size: 2.6rem; line-height: 1.1; }
  .game h2 { margin: 6px 0 0; font-size: 1.2rem; }
  .game p { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.4; }
  .game .tag { margin-top: auto; padding-top: 10px; font-size: 0.85rem; font-weight: 700; color: var(--accent); }
  .game.soon { border-style: dashed; opacity: 0.6; }
  .game.soon .tag { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Jogos 🎮</h1>
  <p class="sub">Escolha um jogo pra começar</p>
  <div class="grid" id="grid"></div>
</main>

<script>
  // Para adicionar um jogo novo, é só colocar mais um item nesta lista.
  const GAMES = [
    {
      name: 'Jokenpô',
      icon: '✊✋✌️',
      description: 'Campeonato de 10 rodadas pra 2 jogadores, com rodada de ouro no empate.',
      href: 'jokenpo/index.html',
    },
  ];

  const grid = document.getElementById('grid');
  GAMES.forEach(game => {
    const card = document.createElement('a');
    card.className = 'game';
    card.href = game.href;
    card.innerHTML = '<span class="icon"></span><h2></h2><p></p><span class="tag">Jogar →</span>';
    card.querySelector('.icon').textContent = game.icon;
    card.querySelector('h2').textContent = game.name;
    card.querySelector('p').textContent = game.description;
    grid.appendChild(card);
  });

  // Card de "em breve"
  const soon = document.createElement('div');
  soon.className = 'game soon';
  soon.innerHTML = '<span class="icon">➕</span><h2>Em breve</h2><p>Mais jogos chegando por aqui.</p><span class="tag">Aguarde</span>';
  grid.appendChild(soon);
</script>
</body>
</html>
